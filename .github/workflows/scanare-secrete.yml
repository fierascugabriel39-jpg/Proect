# Scaner automat de secrete — pornește singur la fiecare modificare urcată pe GitHub.
#
# La ce folosește: dacă vreodată scapă o cheie API, un token sau o parolă în cod,
# verificarea asta pică și te anunță. Rulează pe serverele GitHub, nu pe calculatorul
# tău — deci protejează indiferent de unde vine modificarea (calculator, cloud, telefon).
#
# Ce NU face: nu detectează nume proprii, adrese sau localități. Acelea nu au un format
# recunoscibil pentru un program. Vezi regula din STARE_PROIECT.md, secțiunea 7.

name: Scanare secrete

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # permite pornirea manuală, dintr-un buton pe GitHub

jobs:
  gitleaks:
    name: Caută chei și parole scăpate în cod
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă proiectul (cu tot istoricul)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 0 = tot istoricul, nu doar ultimul commit

      - name: Scanează cu gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --redact: dacă găsește ceva, NU afișează valoarea în jurnalul public.
          # Altfel secretul găsit ar ajunge vizibil tocmai în log.
          GITLEAKS_NOTIFY_USER_LIST: ""
