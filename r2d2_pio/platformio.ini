; [Claude Code 2026-06-18] config pio — upload headless al testului de motor
; pe ESP32 LAFVIN WROOM-32E (de ce: arduino-cli lipseste, GUI nu da proba in sesiune)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
